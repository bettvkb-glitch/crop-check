name: Unpack zip

on:
  workflow_dispatch:
    inputs:
      zipfile:
        description: "Zip file name in repo root"
        default: "crop-check-main-updated.zip"

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip into a temp folder
        run: |
          unzip -q "${{ github.event.inputs.zipfile }}" -d /tmp/unpacked
          # If the zip has a single top-level folder, use it as the source
          SRC=/tmp/unpacked
          if [ "$(ls -1 /tmp/unpacked | wc -l)" -eq 1 ] && [ -d "/tmp/unpacked/$(ls -1 /tmp/unpacked)" ]; then
            SRC="/tmp/unpacked/$(ls -1 /tmp/unpacked)"
          fi
          echo "SRC=$SRC" >> $GITHUB_ENV

      - name: Copy files into the repo
        run: |
          rsync -a --exclude '.git' --exclude '.github' "$SRC"/ ./
          rm -f "${{ github.event.inputs.zipfile }}"

      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -m "Update Crop Check project" || echo "Nothing to commit"
          git push
