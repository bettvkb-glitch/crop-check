name = "cropcheck-api"
main = "src/index.ts"
compatibility_date = "2026-10-01"
workers_dev = true

# Settings added in the Cloudflare dashboard (Variables and Secrets) survive deploys.
keep_vars = true

# Set these in the Cloudflare dashboard, not in this file:
#   SUPABASE_URL        https://YOUR-PROJECT.supabase.co
#   SUPABASE_ANON_KEY   your publishable key
#   ALLOWED_ORIGIN      https://your-site.pages.dev   (comma-separate to allow more)
#   META_BASE_URL       Meta Model API base URL from the hackathon docs
#   VISION_MODEL        model name from the hackathon docs
#   MODEL_API_KEY       (secret) your Meta API key
